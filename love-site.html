<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เว็บไซต์บอกรัก 💌</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff7f9;--card:#fff;--tx:#3b2a30;--mut:#8a7279;--bd:#f1d6dd;--ac:#e8557a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1418;--card:#2a1d23;--tx:#f6e9ed;--mut:#b99ca5;--bd:#4a3039}}
:root[data-theme="dark"]{--bg:#1d1418;--card:#2a1d23;--tx:#f6e9ed;--mut:#b99ca5;--bd:#4a3039}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mut);margin:0 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
.tabs button{flex:1;padding:10px 6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:1.05rem;margin:0 0 8px}
label{display:block;font-size:.88rem;color:var(--mut);margin:8px 0 3px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>.sm{flex:0 0 auto}
.btn{padding:10px 14px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.x{background:transparent;color:var(--mut);padding:6px 10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw.on{border-color:var(--tx)}
.note{font-size:.85rem;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
.toast.show{opacity:1}
/* love view */
.love{--a:#e8557a;--g1:#ffe3ec;--g2:#ffc2d4;min-height:100vh;background:linear-gradient(160deg,var(--g1),var(--g2));color:#3b2a30;position:relative;overflow:hidden;border-radius:18px;padding:0 0 30px}
.love.full{border-radius:0}
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx span{position:absolute;bottom:-30px;animation:up linear forwards;opacity:.85}
@keyframes up{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.cover{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;position:relative}
.env{font-size:6rem;animation:beat 1.4s infinite}
@keyframes beat{50%{transform:scale(1.12)}}
.cover h2{font-size:1.6rem;margin:8px 0}
.sec{max-width:560px;margin:18px auto;padding:0 16px;position:relative}
.bubble{background:rgba(255,255,255,.82);border-radius:20px;padding:20px;box-shadow:0 6px 24px rgba(0,0,0,.08);animation:rise .8s both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.big{font-size:1.7rem;text-align:center;color:var(--a);margin:0 0 6px;font-weight:700}
.msg{white-space:pre-wrap;font-size:1.05rem}
.days{text-align:center}.days b{font-size:2.6rem;color:var(--a);display:block}
.reasons{display:grid;gap:8px}
.reasons div{background:rgba(255,255,255,.82);border-left:5px solid var(--a);border-radius:12px;padding:10px 14px;animation:rise .8s both}
.tl{border-left:3px dashed var(--a);margin-left:8px;padding-left:16px}
.tl div{margin-bottom:14px}.tl small{color:var(--a);font-weight:700;display:block}
.sign{text-align:center;font-size:1.2rem;color:var(--a);font-weight:700}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<script>
var THEMES={pink:["#e8557a","#ffe3ec","#ffc2d4","💗"],red:["#d6293e","#ffe0e0","#ffb3b3","❤️"],purple:["#8e5bd6","#efe5ff","#d6c2ff","💜"],blue:["#3d8bd9","#e0f0ff","#b8dbff","💙"],green:["#3aa675","#e1f7ea","#b7e8cf","💚"],sunset:["#f0803c","#fff0dc","#ffd0b0","🧡"]};
var EFFECTS={hearts:["💖","💕","💗","❤️"],stars:["✨","⭐","🌟"],petals:["🌸","🌷","🌹"],none:[]};
var DEF={to:"",from:"",title:"ฉันมีอะไรจะบอกเธอ",msg:"",start:"",reasons:[""],mems:[{d:"",t:""}],close:"รักเธอเสมอ",theme:"pink",fx:"hearts",cover:"💌"};
var KEY="love-site-v1",mem={},data=clone(DEF),tab="edit",timer=null;

function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function $(i){return document.getElementById(i)}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(function(){e.classList.remove("show")},1800)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){if(v===undefined)return mem[k]||null;mem[k]=v}}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function dec(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";return JSON.parse(decodeURIComponent(escape(atob(s))))}
function save(){store(KEY,JSON.stringify(data))}
function load(){try{var s=store(KEY);if(s)data=Object.assign(clone(DEF),JSON.parse(s))}catch(e){}}

function loveHTML(d){
  var t=THEMES[d.theme]||THEMES.pink,days="";
  if(d.start){var n=Math.floor((Date.now()-new Date(d.start))/864e5);if(n>=0)days='<div class="sec"><div class="bubble days">เราอยู่ด้วยกันมาแล้ว<b>'+n.toLocaleString("th-TH")+'</b>วัน '+t[3]+'</div></div>'}
  var rs=(d.reasons||[]).filter(function(x){return x.trim()}),ms=(d.mems||[]).filter(function(x){return x.t.trim()});
  return '<div class="love" style="--a:'+t[0]+';--g1:'+t[1]+';--g2:'+t[2]+'"><div class="fx"></div>'+
  '<div class="cover" data-open><div class="env">'+esc(d.cover)+'</div><h2>ถึง '+esc(d.to||"คนพิเศษ")+'</h2><div>แตะเพื่อเปิดอ่าน</div></div>'+
  '<div class="body hide">'+
  '<div class="sec"><div class="bubble"><p class="big">'+esc(d.title)+'</p><p class="msg">'+esc(d.msg||"...")+'</p></div></div>'+days+
  (rs.length?'<div class="sec"><p class="big">เหตุผลที่ฉันรักเธอ</p><div class="reasons">'+rs.map(function(r,i){return'<div style="animation-delay:'+i*.15+'s">'+t[3]+' '+esc(r)+'</div>'}).join("")+'</div></div>':"")+
  (ms.length?'<div class="sec"><div class="bubble"><p class="big">ความทรงจำของเรา</p><div class="tl">'+ms.map(function(m){return'<div><small>'+esc(m.d)+'</small>'+esc(m.t)+'</div>'}).join("")+'</div></div></div>':"")+
  '<div class="sec"><div class="bubble"><p class="sign">'+esc(d.close)+'<br>— '+esc(d.from||"ฉัน")+' '+t[3]+'</p></div></div></div></div>';
}
function startFx(root,d){
  clearInterval(timer);var set=EFFECTS[d.fx]||[],box=root.querySelector(".fx");
  if(!set.length||!box)return;
  timer=setInterval(function(){if(!document.body.contains(box)){clearInterval(timer);return}
    var s=document.createElement("span");s.textContent=set[Math.floor(Math.random()*set.length)];
    s.style.left=Math.random()*95+"%";s.style.fontSize=14+Math.random()*22+"px";s.style.animationDuration=5+Math.random()*5+"s";
    box.appendChild(s);setTimeout(function(){s.remove()},10500)},450);
}
function bindLove(root,d){
  startFx(root,d);
  var c=root.querySelector("[data-open]");
  if(c)c.onclick=function(){c.classList.add("hide");root.querySelector(".body").classList.remove("hide");window.scrollTo({top:0,behavior:"smooth"})};
}

function shareURL(){return location.href.split("#")[0]+"#v="+enc(data)}

function render(){
  var app=$("app");
  var h=location.hash.match(/^#v=(.+)$/);
  if(h){var d;try{d=dec(h[1])}catch(e){app.innerHTML='<div class="wrap card">ลิงก์ไม่ถูกต้อง 😢</div>';return}
    app.style.padding="0";app.style.maxWidth="none";app.innerHTML=loveHTML(d)+'<p class="note" style="text-align:center;padding:10px"><a href="'+esc(location.href.split("#")[0])+'" style="color:inherit">สร้างเว็บบอกรักของคุณเอง</a></p>';
    app.firstChild.classList.add("full");bindLove(app,d);return}
  var tabs='<div class="tabs">'+[["edit","✏️ กรอกข้อมูล"],["prev","👀 ตัวอย่าง"],["share","🔗 ส่งให้แฟน"]].map(function(x){return'<button data-tab="'+x[0]+'" class="'+(tab===x[0]?"on":"")+'">'+x[1]+'</button>'}).join("")+'</div>';
  var head='<h1>💌 เว็บไซต์บอกรัก</h1><p class="sub">ข้อมูลของคุณบันทึกไว้ในเครื่องคุณเองเท่านั้น คนอื่นมองไม่เห็น</p>';
  if(tab==="edit")app.innerHTML=head+tabs+editHTML();
  else if(tab==="prev"){app.innerHTML=head+tabs+loveHTML(data);bindLove(app,data)}
  else app.innerHTML=head+tabs+shareHTML();
}
function editHTML(){
  var th=Object.keys(THEMES).map(function(k){return'<div class="sw '+(data.theme===k?"on":"")+'" data-theme="'+k+'" style="background:'+THEMES[k][0]+'"></div>'}).join("");
  return '<div class="card"><h2>👫 ข้อมูลพื้นฐาน</h2><div class="row"><div><label>ชื่อแฟน/ชื่อเล่นที่เรียก</label><input data-f="to" value="'+esc(data.to)+'"></div><div><label>ชื่อของคุณ</label><input data-f="from" value="'+esc(data.from)+'"></div></div>'+
  '<label>วันที่เริ่มคบกัน (ใส่หรือไม่ใส่ก็ได้)</label><input type="date" data-f="start" value="'+esc(data.start)+'"></div>'+
  '<div class="card"><h2>💬 ข้อความหลัก</h2><label>หัวข้อ</label><input data-f="title" value="'+esc(data.title)+'"><label>ข้อความบอกรัก</label><textarea data-f="msg" placeholder="เขียนจากใจของคุณ...">'+esc(data.msg)+'</textarea><label>ข้อความปิดท้าย</label><input data-f="close" value="'+esc(data.close)+'"></div>'+
  '<div class="card"><h2>🥰 เหตุผลที่รัก</h2>'+data.reasons.map(function(r,i){return'<div class="row" style="margin-bottom:6px"><input data-r="'+i+'" value="'+esc(r)+'" placeholder="เช่น รอยยิ้มของเธอ"><button class="btn x sm" data-delr="'+i+'">✕</button></div>'}).join("")+'<button class="btn ghost" data-addr>+ เพิ่มเหตุผล</button></div>'+
  '<div class="card"><h2>📸 ความทรงจำ</h2>'+data.mems.map(function(m,i){return'<div style="margin-bottom:10px"><div class="row"><input data-md="'+i+'" value="'+esc(m.d)+'" placeholder="วันที่/ช่วงเวลา"><button class="btn x sm" data-delm="'+i+'">✕</button></div><input data-mt="'+i+'" value="'+esc(m.t)+'" placeholder="เหตุการณ์ที่จำได้" style="margin-top:6px"></div>'}).join("")+'<button class="btn ghost" data-addm>+ เพิ่มความทรงจำ</button></div>'+
  '<div class="card"><h2>🎨 ตกแต่ง</h2><label>สีธีม</label><div class="swatches">'+th+'</div><div class="row"><div><label>เอฟเฟกต์ลอย</label><select data-f="fx">'+[["hearts","หัวใจ"],["stars","ดาว"],["petals","ดอกไม้"],["none","ไม่มี"]].map(function(o){return'<option value="'+o[0]+'"'+(data.fx===o[0]?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select></div><div><label>ไอคอนหน้าซอง</label><select data-f="cover">'+["💌","💝","🌹","🧸","🎁"].map(function(o){return'<option'+(data.cover===o?" selected":"")+'>'+o+'</option>'}).join("")+'</select></div></div></div>'+
  '<div class="row"><button class="btn ghost" data-reset>ล้างข้อมูล</button><button class="btn" data-go="share">ไปขั้นตอนส่งลิงก์ →</button></div><p class="note">บันทึกอัตโนมัติทุกครั้งที่พิมพ์</p>';
}
function shareHTML(){
  var u=shareURL();
  return '<div class="card"><h2>🔗 ลิงก์สำหรับส่งให้แฟน</h2><p class="note">ข้อมูลทั้งหมดถูกฝังอยู่ในลิงก์นี้ ใครมีลิงก์ก็เปิดอ่านได้ ส่งเฉพาะคนที่ต้องการให้เห็น</p><textarea readonly id="lnk" style="min-height:90px">'+esc(u)+'</textarea><div class="row" style="margin-top:8px"><button class="btn" data-copy>คัดลอกลิงก์</button><button class="btn ghost" data-nat>แชร์</button></div></div>'+
  '<div class="card"><h2>⚠️ ก่อนส่ง</h2><p class="note" style="margin:0">แฟนต้องเปิดลิงก์หน้านี้ได้ ถ้าหน้านี้ยังเป็นส่วนตัวอยู่ ให้กดแชร์หน้าเว็บนี้ให้เขาเข้าถึงได้ก่อน แล้วค่อยส่งลิงก์ด้านบน</p></div>';
}

document.addEventListener("input",function(e){
  var t=e.target;if(!t.dataset)return;
  if(t.dataset.f)data[t.dataset.f]=t.value;
  else if(t.dataset.r!==undefined)data.reasons[+t.dataset.r]=t.value;
  else if(t.dataset.md!==undefined)data.mems[+t.dataset.md].d=t.value;
  else if(t.dataset.mt!==undefined)data.mems[+t.dataset.mt].t=t.value;
  else return;save()});
document.addEventListener("change",function(e){if(e.target.dataset&&e.target.dataset.f&&e.target.tagName==="SELECT"){data[e.target.dataset.f]=e.target.value;save()}});
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-tab],[data-theme],[data-addr],[data-delr],[data-addm],[data-delm],[data-reset],[data-go],[data-copy],[data-nat]");if(!t)return;var d=t.dataset;
  if(d.tab){tab=d.tab}
  else if(d.theme){data.theme=d.theme}
  else if(d.addr!==undefined){data.reasons.push("")}
  else if(d.delr){data.reasons.splice(+d.delr,1);if(!data.reasons.length)data.reasons=[""]}
  else if(d.addm!==undefined){data.mems.push({d:"",t:""})}
  else if(d.delm){data.mems.splice(+d.delm,1);if(!data.mems.length)data.mems=[{d:"",t:""}]}
  else if(d.reset!==undefined){if(!confirm("ล้างข้อมูลทั้งหมด?"))return;data=clone(DEF)}
  else if(d.go){tab=d.go}
  else if(d.copy!==undefined){var u=shareURL();(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast("คัดลอกแล้ว ✅")},function(){var l=$("lnk");l.select();document.execCommand("copy");toast("คัดลอกแล้ว ✅")});return}
  else if(d.nat!==undefined){if(navigator.share)navigator.share({title:"ถึง "+data.to,url:shareURL()}).catch(function(){});else toast("กดคัดลอกลิงก์แทนนะ");return}
  save();render();window.scrollTo(0,0)});
window.addEventListener("hashchange",render);
load();render();
</script>
</body>
</html>
